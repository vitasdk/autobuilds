name: Build SDK snapshots

on:
  workflow_dispatch:
    inputs:
      buildscripts_ref:
        description: Branch, tag or commit from vitasdk/buildscripts
        required: false
        type: string
  push:
    branches: [master]
  pull_request:
  repository_dispatch:
    types: [run_build]

concurrency:
  group: autobuilds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Which world this workflow drives; softfp wiring is separate follow-up work.
  PROFILE: vita
  # Release policy, not build knowledge: which hosts must publish.
  REQUIRED_HOSTS: "x86_64-linux-gnu aarch64-linux-gnu arm64-apple-darwin x86_64-w64-mingw32"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      buildscripts_ref: ${{ steps.ref.outputs.ref }}
      buildscripts_revision: ${{ steps.describe.outputs.buildscripts_revision }}
      build_id: ${{ steps.describe.outputs.build_id }}
      version: ${{ steps.describe.outputs.version }}
      series: ${{ steps.describe.outputs.series }}
      lock: ${{ steps.describe.outputs.lock }}
    steps:
      - id: ref
        shell: bash
        run: |
          raw_ref='${{ inputs.buildscripts_ref }}'
          echo "ref=${raw_ref:-master}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: vitasdk/buildscripts
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          path: buildscripts

      - id: describe
        shell: bash
        working-directory: buildscripts
        run: |
          lock_path="$RUNNER_TEMP/lock.json"
          ./buildscripts-ci describe --profile "$PROFILE" --output "$lock_path"
          {
            echo "lock<<LOCK_JSON_EOF"
            cat "$lock_path"
            echo "LOCK_JSON_EOF"
          } >> "$GITHUB_OUTPUT"
          # series is null for a nightly and the series name for a
          # release, so the announcement below never has to guess.
          jq -r '"build_id=\(.build_id)", "buildscripts_revision=\(.buildscripts_revision)", "version=\(.version)", "series=\(.series // "")"' \
            "$lock_path" >> "$GITHUB_OUTPUT"

      - name: Check the required hosts are buildable at this revision
        shell: bash
        run: |
          buildable_hosts=$(jq -r '.hosts[].name' "$RUNNER_TEMP/lock.json" | LC_ALL=C sort -u)
          for host in $REQUIRED_HOSTS; do
            grep -qxF "$host" <<<"$buildable_hosts" || {
              echo "::error::required host $host cannot be built at buildscripts revision ${{ steps.describe.outputs.buildscripts_revision }}"
              exit 1
            }
          done

  build:
    needs: prepare
    uses: vitasdk/buildscripts/.github/workflows/build-sdk.yml@master
    with:
      lock: ${{ needs.prepare.outputs.lock }}

  publish-snapshot:
    needs: [prepare, build]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      snapshot_tag: ${{ steps.publish.outputs.snapshot_tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: vitasdk/buildscripts
          ref: ${{ needs.prepare.outputs.buildscripts_revision }}
          path: buildscripts

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.release_tree_artifact }}
          path: repository

      - name: Verify the grouped release tree
        shell: bash
        run: buildscripts/buildscripts-ci verify --tree repository

      - name: Enforce the required-host publication policy
        shell: bash
        run: |
          tree_build_id=$(jq -r .build_id repository/release.json)
          [[ $tree_build_id == '${{ needs.prepare.outputs.build_id }}' ]] || {
            echo "::error::release tree build_id $tree_build_id does not match the lock's ${{ needs.prepare.outputs.build_id }}"
            exit 1
          }
          published_hosts=$(jq -r '.hosts[].name' repository/release.json | LC_ALL=C sort -u)
          for host in $REQUIRED_HOSTS; do
            grep -qxF "$host" <<<"$published_hosts" || {
              echo "::error::required host $host is missing from the published release tree"
              exit 1
            }
          done

      - name: Publish immutable grouped snapshot
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          # The lock names every source revision that went in; without it a
          # snapshot records what it contains but not what produced it.
          LOCK_JSON: ${{ needs.prepare.outputs.lock }}
        shell: bash
        run: |
          mkdir publish
          cp repository/* publish/
          printf '%s\n' "$LOCK_JSON" > publish/lock.json
          snapshot_tag="sdk-snapshot-$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "snapshot_tag=$snapshot_tag" >> "$GITHUB_OUTPUT"
          gh release create "$snapshot_tag" --draft --prerelease \
            --target "$GITHUB_SHA" --title "$snapshot_tag" \
            --notes "Package-managed SDK preview built from buildscripts revision ${{ needs.prepare.outputs.buildscripts_revision }}."
          gh release upload "$snapshot_tag" publish/*
          mkdir downloaded-release
          gh release download "$snapshot_tag" --dir downloaded-release
          diff -ru publish downloaded-release
          gh release edit "$snapshot_tag" --draft=false

      # The catalogue is built by vitasdk/vitasdk-autobuild, which pins the
      # core it builds against rather than being handed one per build. All it
      # needs is the tag: what to build, and which recipes, are its own.
      - name: Announce the published core to the package autobuilder
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::REPO_DISPATCH_TOKEN secret is required for cross-repo dispatch to vitasdk/vitasdk-autobuild"
            exit 1
          fi
          gh api repos/vitasdk/vitasdk-autobuild/dispatches \
            -f event_type=core_published \
            -f client_payload[core_snapshot]="${{ steps.publish.outputs.snapshot_tag }}" \
            -f client_payload[series]="${{ needs.prepare.outputs.series }}"
