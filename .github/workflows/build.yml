name: Build SDK snapshots

on:
  workflow_dispatch:
    inputs:
      buildscripts_ref:
        description: Branch, tag or commit from vitasdk/buildscripts
        required: false
        type: string
  push:
    branches: [master, next]
  pull_request:
  schedule:
    - cron: '43 2 * * *'
  repository_dispatch:
    types: [run_build]

concurrency:
  group: autobuilds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VDPM_RELEASE_TAG: v0.1.0-alpha.1
  VDPM_WINDOWS_SHA256: 92c368ea5a22c6da10090e5360df16bfb102f39c7fef8832a12777a087a52580

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      buildscripts_ref: ${{ steps.inputs.outputs.buildscripts_ref }}
      package_version: ${{ steps.inputs.outputs.package_version }}
    steps:
      - id: inputs
        shell: bash
        run: |
          if [[ -n '${{ inputs.buildscripts_ref }}' ]]; then
            buildscripts_ref='${{ inputs.buildscripts_ref }}'
          elif [[ '${{ github.base_ref || github.ref_name }}' == next ]]; then
            buildscripts_ref=next
          else
            buildscripts_ref=master
          fi
          echo "buildscripts_ref=$buildscripts_ref" >> "$GITHUB_OUTPUT"
          echo "package_version=0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            >> "$GITHUB_OUTPUT"

  build-core:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            host: x86_64-linux-gnu
            vdpm_sha256: 4fb5b75c0900f59c33ddd354140ddfc6c7a8741b7c8b3dcd081b3d50618b1fbb
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            host: aarch64-linux-gnu
            vdpm_sha256: 10e101bd7b0414168b2610f06c9872391e973783a8e3889946f7bd14a2fa7367
          - name: macos-arm64
            runner: macos-15
            host: arm64-apple-darwin
            vdpm_sha256: aa47e5984fbdb1ae85774d5abd65ae79c57917ebf06792acf99bc9f4995425ae
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison build-essential ccache cmake flex gettext \
            libtool pkg-config texinfo

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake ccache libtool texinfo

      - name: Check out exact build scripts
        id: source
        shell: bash
        run: |
          git clone --depth=1 --branch '${{ needs.prepare.outputs.buildscripts_ref }}' \
            https://github.com/vitasdk/buildscripts.git buildscripts
          revision=$(git -C buildscripts rev-parse HEAD)
          source_date_epoch=$(git -C buildscripts show -s --format=%ct HEAD)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$source_date_epoch" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            buildscripts/build/downloads
            ~/.ccache
            ~/Library/Caches/ccache
          key: sdk-${{ matrix.name }}-${{ steps.source.outputs.revision }}
          restore-keys: sdk-${{ matrix.name }}-

      - name: Download exact vdpm host component
        id: vdpm
        env:
          GH_TOKEN: ${{ github.token }}
          VDPM_HOST: ${{ matrix.host }}
          VDPM_SHA256: ${{ matrix.vdpm_sha256 }}
        shell: bash
        run: |
          mkdir vdpm-release
          gh release download "$VDPM_RELEASE_TAG" --repo vitasdk/vdpm \
            --pattern "vdpm-*-$VDPM_HOST.tar.bz2" \
            --pattern "vdpm-*-$VDPM_HOST.tar.bz2.sha256" \
            --dir vdpm-release
          archive_count=$(find vdpm-release -maxdepth 1 -type f \
            -name "vdpm-*-$VDPM_HOST.tar.bz2" | wc -l)
          sidecar_count=$(find vdpm-release -maxdepth 1 -type f \
            -name "vdpm-*-$VDPM_HOST.tar.bz2.sha256" | wc -l)
          [[ $archive_count -eq 1 && $sidecar_count -eq 1 ]]
          archive=$(find vdpm-release -maxdepth 1 -type f \
            -name "vdpm-*-$VDPM_HOST.tar.bz2" -print -quit)
          sidecar=$(find vdpm-release -maxdepth 1 -type f \
            -name "vdpm-*-$VDPM_HOST.tar.bz2.sha256" -print -quit)
          if command -v sha256sum >/dev/null; then
            actual=$(sha256sum "$archive")
          else
            actual=$(shasum -a 256 "$archive")
          fi
          actual=${actual%% *}
          sidecar_digest=$(awk '{print $1}' "$sidecar")
          [[ $actual == "$VDPM_SHA256" && $sidecar_digest == "$VDPM_SHA256" ]]
          echo "archive=$PWD/$archive" >> "$GITHUB_OUTPUT"

      - name: Build core package, bootstrap and compatibility archive
        shell: bash
        run: |
          cmake -S buildscripts -B buildscripts/build \
            -DBUILD_PACMAN_CLIENT=ON \
            -DPACMAN_CLIENT_INSTALL_DIR="$PWD/buildscripts/build/vitasdk" \
            -DVITASDK_PACKAGE_VERSION='${{ needs.prepare.outputs.package_version }}' \
            -DVITASDK_SOURCE_DATE_EPOCH='${{ steps.source.outputs.source_date_epoch }}' \
            -DVITASDK_SOURCE_REVISION='${{ steps.source.outputs.revision }}' \
            -DVDPM_BUNDLE='${{ steps.vdpm.outputs.archive }}' \
            -DVDPM_BUNDLE_SHA256='${{ matrix.vdpm_sha256 }}'
          if [[ $RUNNER_OS == macOS ]]; then
            jobs=$(sysctl -n hw.logicalcpu)
          else
            jobs=$(nproc)
          fi
          cmake --build buildscripts/build \
            --target core-package bootstrap-archive tarball --parallel "$jobs"

      - name: Exercise clean host bootstrap
        shell: bash
        run: |
          archive_count=$(find buildscripts/build/bootstraps -maxdepth 1 \
            -type f -name 'vitasdk-bootstrap-*.tar.bz2' | wc -l)
          [[ $archive_count -eq 1 ]]
          archive=$(find buildscripts/build/bootstraps -maxdepth 1 \
            -type f -name 'vitasdk-bootstrap-*.tar.bz2' -print -quit)
          digest=$(awk '{print $1}' "$archive.sha256")
          install_root="$RUNNER_TEMP/vitasdk-bootstrap-installed"
          VITASDK_BOOTSTRAP_ARCHIVE="$PWD/$archive" \
          VITASDK_BOOTSTRAP_SHA256="$digest" \
            buildscripts/build/vitasdk/share/vdpm/bootstrap-vitasdk.sh \
              --install-dir "$install_root"
          VITASDK="$install_root" "$install_root/bin/vdpm" --help >/dev/null
          "$install_root/bin/pacman" --version >/dev/null
          "$install_root/bin/arm-vita-eabi-gcc" --version

      - name: Stage host artifacts
        shell: bash
        run: |
          mkdir host-artifacts
          cp buildscripts/build/packages/vitasdk-core-*.pkg.tar.xz \
            buildscripts/build/bootstraps/vitasdk-bootstrap-*.tar.bz2 \
            buildscripts/build/bootstraps/vitasdk-bootstrap-*.tar.bz2.sha256 \
            buildscripts/build/vitasdk-*.tar.bz2 host-artifacts/

      - name: Upload host artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.name }}
          path: host-artifacts/*
          if-no-files-found: error
          retention-days: 14

  build-windows:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison build-essential ccache cmake flex \
            g++-mingw-w64 libarchive-tools libtool pkg-config texinfo xz-utils
      - name: Check out build scripts at depth one
        id: source
        shell: bash
        run: |
          git clone --depth=1 --branch '${{ needs.prepare.outputs.buildscripts_ref }}' \
            https://github.com/vitasdk/buildscripts.git buildscripts
          revision=$(git -C buildscripts rev-parse HEAD)
          source_date_epoch=$(git -C buildscripts show -s --format=%ct HEAD)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$source_date_epoch" >> "$GITHUB_OUTPUT"
      - name: Download exact vdpm Windows component
        id: vdpm
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir vdpm-release
          gh release download "$VDPM_RELEASE_TAG" --repo vitasdk/vdpm \
            --pattern 'vdpm-*-x86_64-w64-mingw32.tar.bz2' \
            --pattern 'vdpm-*-x86_64-w64-mingw32.tar.bz2.sha256' \
            --dir vdpm-release
          mapfile -t archives < <(find vdpm-release -maxdepth 1 -type f \
            -name 'vdpm-*-x86_64-w64-mingw32.tar.bz2')
          [[ ${#archives[@]} -eq 1 ]]
          archive=${archives[0]}
          actual=$(sha256sum "$archive")
          actual=${actual%% *}
          [[ $actual == "$VDPM_WINDOWS_SHA256" ]]
          (cd vdpm-release && sha256sum -c *.tar.bz2.sha256)
          echo "archive=$PWD/$archive" >> "$GITHUB_OUTPUT"
      - name: Build Windows core package, bootstrap and compatibility archive
        shell: bash
        run: |
          unset CC CXX
          cmake -S buildscripts -B buildscripts/build \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/buildscripts/toolchain-x86_64-w64-mingw32.cmake" \
            -DBUILD_PACMAN_CLIENT=ON \
            -DVDPM_BUNDLE='${{ steps.vdpm.outputs.archive }}' \
            -DVDPM_BUNDLE_SHA256="$VDPM_WINDOWS_SHA256" \
            -DVITASDK_PACKAGE_VERSION='${{ needs.prepare.outputs.package_version }}' \
            -DVITASDK_SOURCE_DATE_EPOCH='${{ steps.source.outputs.source_date_epoch }}' \
            -DVITASDK_SOURCE_REVISION='${{ steps.source.outputs.revision }}'
          cmake --build buildscripts/build \
            --target core-package bootstrap-archive tarball --parallel "$(nproc)"
      - name: Stage Windows host artifacts
        shell: bash
        run: |
          mkdir host-artifacts
          cp buildscripts/build/packages/vitasdk-core-*.pkg.tar.xz \
            buildscripts/build/bootstraps/vitasdk-bootstrap-*.tar.bz2 \
            buildscripts/build/bootstraps/vitasdk-bootstrap-*.tar.bz2.sha256 \
            buildscripts/build/vitasdk-*.tar.bz2 host-artifacts/
      - name: Upload Windows host artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-windows-x86_64
          path: host-artifacts/*
          if-no-files-found: error
          retention-days: 14

  test-windows-bootstrap:
    needs: [prepare, build-windows]
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: core-windows-x86_64
          path: artifacts
      - name: Check out the matching bootstrap frontend
        shell: pwsh
        run: |
          git clone --depth=1 --branch $env:VDPM_RELEASE_TAG `
            https://github.com/vitasdk/vdpm.git vdpm
      - name: Exercise clean Windows bootstrap
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem artifacts -Recurse -Filter 'vitasdk-bootstrap-*.tar.bz2')
          if ($archives.Count -ne 1) { throw 'expected exactly one Windows bootstrap' }
          $archive = $archives[0].FullName
          $checksum = Get-Content "${archive}.sha256"
          $digest = ($checksum -split '\s+')[0]
          $installRoot = Join-Path $env:RUNNER_TEMP 'vitasdk-bootstrap-installed'
          ./vdpm/bootstrap-vitasdk.ps1 `
            -ArchivePath $archive -Sha256 $digest -InstallDirectory $installRoot
          $env:VITASDK = $installRoot
          & (Join-Path $installRoot 'bin/vdpm.exe') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'vdpm self-test failed' }
          & (Join-Path $installRoot 'usr/bin/pacman.exe') --version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Pacman self-test failed' }
          & (Join-Path $installRoot 'bin/arm-vita-eabi-gcc.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'compiler self-test failed' }

  create-grouped-release:
    needs: [prepare, build-core, build-windows, test-windows-bootstrap]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: inputs
          pattern: core-*
          merge-multiple: true
      - name: Create grouped host repositories
        shell: bash
        run: |
          expected=(
            x86_64-linux-gnu
            aarch64-linux-gnu
            arm64-apple-darwin
            x86_64-w64-mingw32
          )
          for host in "${expected[@]}"; do
            test -f "inputs/vitasdk-bootstrap-$host.tar.bz2"
            compgen -G "inputs/vitasdk-core-*-$host.pkg.tar.*" >/dev/null
          done
          docker run --rm \
            --platform linux/amd64 \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$PWD/inputs,target=/input,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP,target=/output" \
            --env SDK_ARCHIVE_DIRECTORY=/input \
            archlinux@sha256:c1829f370be8434135f43fb3acaef1256780804ac3b2d2eec90dfb1232e1ffdf \
            bash -euc '
              first_package=$(printf "%s\n" /input/vitasdk-core-*.pkg.tar.* | sort | head -n1)
              SOURCE_DATE_EPOCH=$(bsdtar -xOf "$first_package" .PKGINFO |
                awk -F " = " '\''$1 == "builddate" { print $2; exit }'\'')
              export SOURCE_DATE_EPOCH
              /workspace/scripts/create-core-repositories.sh \
                /output/repository /input/vitasdk-core-*.pkg.tar.*
            '

      - uses: actions/upload-artifact@v4
        with:
          name: grouped-sdk-snapshot
          path: ${{ runner.temp }}/repository/*
          if-no-files-found: error
          retention-days: 14

  publish-snapshot:
    needs: create-grouped-release
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: grouped-sdk-snapshot
          path: repository
      - name: Validate downloaded release transaction
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            archlinux@sha256:c1829f370be8434135f43fb3acaef1256780804ac3b2d2eec90dfb1232e1ffdf \
            /workspace/scripts/validate-core-repositories.sh /workspace/repository
      - name: Publish immutable grouped snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          snapshot_tag="sdk-snapshot-$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$snapshot_tag" --draft --prerelease \
            --target "$GITHUB_SHA" --title "$snapshot_tag" \
            --notes 'Package-managed SDK preview with verified bootstraps for every supported host.'
          gh release upload "$snapshot_tag" repository/*
          mkdir downloaded-release
          gh release download "$snapshot_tag" --dir downloaded-release
          diff -ru repository downloaded-release
          gh release edit "$snapshot_tag" --draft=false
