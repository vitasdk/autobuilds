name: Build SDK snapshots

on:
  workflow_dispatch:
    inputs:
      buildscripts_ref:
        description: Branch, tag or commit from vitasdk/buildscripts
        required: false
        type: string
      profile:
        description: World to build (leave empty for the policy default)
        required: false
        type: string
  push:
    branches: [master]
  pull_request:
  # A backstop, not the trigger: buildscripts announces every revision it
  # takes, and this catches the announcement that never arrived. An input
  # already built stops at describe, so an idle run costs one job.
  schedule:
    - cron: "20 */6 * * *"
  repository_dispatch:
    types: [run_build]

# Which build this is, is the lock's build_id, and describe computes it inside
# the run -- too late for a group named here. A pull request stays keyed on its
# ref so a new push still cancels the run it superseded; every other trigger
# gets a group of its own. One queue slot shared by all of them is what let a
# push to this repository evict the revision buildscripts had just announced:
# a run held in a group is cancelled, not delayed. The same input arriving
# twice is handled where the input is known -- dedup in prepare, and the
# build_id group on the build job.
concurrency:
  group: autobuilds-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The world this workflow drives unless a trigger names another one.
  DEFAULT_PROFILE: vita
  # Release policy, not build knowledge: which hosts must publish.
  REQUIRED_HOSTS: "x86_64-linux-gnu aarch64-linux-gnu arm64-apple-darwin x86_64-w64-mingw32"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    # The candidate pointer is a commit on the state branch.
    permissions:
      contents: write
    outputs:
      buildscripts_ref: ${{ steps.ref.outputs.ref }}
      buildscripts_revision: ${{ steps.describe.outputs.buildscripts_revision }}
      build_id: ${{ steps.describe.outputs.build_id }}
      version: ${{ steps.describe.outputs.version }}
      series: ${{ steps.describe.outputs.series }}
      profile: ${{ steps.ref.outputs.profile }}
      lock: ${{ steps.describe.outputs.lock }}
      # Two ways to have nothing to build: it is published already, or another
      # run is building it right now.
      duplicate: ${{ steps.dedup.outputs.duplicate == 'true' || steps.candidate.outputs.held == 'true' }}
      generation: ${{ steps.candidate.outputs.generation }}
    steps:
      - id: ref
        shell: bash
        env:
          # Whoever asks for a build says which revision and which world;
          # a schedule or a plain push asks for the policy default.
          REQUESTED_REF: ${{ inputs.buildscripts_ref || github.event.client_payload.buildscripts_ref }}
          REQUESTED_PROFILE: ${{ inputs.profile || github.event.client_payload.profile }}
        run: |
          ref=${REQUESTED_REF:-master}
          profile=${REQUESTED_PROFILE:-$DEFAULT_PROFILE}
          # Whoever dispatches writes these; a value carrying a newline
          # would write a second output of its choosing, and one of the
          # outputs here decides whether the build runs at all.
          [[ $ref =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "::error::refusing a buildscripts ref that is not a plain git ref"
            exit 1
          }
          [[ $profile =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "::error::refusing a profile name that is not a plain world name"
            exit 1
          }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: vitasdk/buildscripts
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          path: buildscripts

      - id: describe
        shell: bash
        working-directory: buildscripts
        env:
          PROFILE: ${{ steps.ref.outputs.profile }}
        run: |
          lock_path="$RUNNER_TEMP/lock.json"
          ./buildscripts-ci describe --profile "$PROFILE" --output "$lock_path"
          {
            echo "lock<<LOCK_JSON_EOF"
            cat "$lock_path"
            echo "LOCK_JSON_EOF"
          } >> "$GITHUB_OUTPUT"
          # series is null for a nightly and the series name for a
          # release, so the announcement below never has to guess.
          jq -r '"build_id=\(.build_id)", "buildscripts_revision=\(.buildscripts_revision)", "version=\(.version)", "series=\(.series // "")"' \
            "$lock_path" >> "$GITHUB_OUTPUT"

      - name: Check the required hosts are buildable at this revision
        shell: bash
        run: |
          buildable_hosts=$(jq -r '.hosts[].name' "$RUNNER_TEMP/lock.json" | LC_ALL=C sort -u)
          for host in $REQUIRED_HOSTS; do
            grep -qxF "$host" <<<"$buildable_hosts" || {
              echo "::error::required host $host cannot be built at buildscripts revision ${{ steps.describe.outputs.buildscripts_revision }}"
              exit 1
            }
          done

      - name: Stop if this input already has a published snapshot
        id: dedup
        # Never on a pull request: the input under test is whatever
        # buildscripts master holds, so every pull request would find its
        # own snapshot published and go green having built nothing.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ steps.describe.outputs.build_id }}
        shell: bash
        run: |
          # Newest first, one page: deeper than any rebuild of an old input
          # would reach, and a single request.
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            > "$RUNNER_TEMP/releases.json"
          published=$(python3 scripts/find-built-snapshot.py \
            --build-id "$BUILD_ID" --releases "$RUNNER_TEMP/releases.json")
          if [[ -n $published ]]; then
            echo "duplicate=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$BUILD_ID is already published as $published; nothing to build"
          else
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
          fi

      # describe refuses a version that does not exceed the one given, and
      # this is the only thing that knows what that is. It runs after the
      # deduplication and not inside describe, because an input that was
      # already built answers with the version it answered with last time:
      # asked before, the six-hourly backstop on an untouched master would
      # refuse itself rather than stop at "already published".
      - name: Check the version does not go backwards
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && steps.dedup.outputs.duplicate != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ steps.ref.outputs.profile }}
          SERIES: ${{ steps.describe.outputs.series }}
          STATE_URL: ${{ github.server_url }}/${{ github.repository }}
          BUILD_ID: ${{ steps.describe.outputs.build_id }}
        run: |
          # A declared version is a patch of a series, and the number it may
          # not go back past is that series' own -- not the world's last
          # candidate, which mixes nightly and stable, and every nightly sorts
          # below every stable. Which is why this used to stop here: the only
          # previous version it had said nothing. The series' does, and
          # channels.json plus the lock inside the core it points at is where
          # it is written down.
          if [[ -f buildscripts/VERSION ]]; then
            [[ -n $SERIES ]] || {
              echo "::error::this revision declares a version but describe derived no series from it"
              exit 1
            }
            serving=$(python3 scripts/promotions.py --after channels.json --serving "$SERIES")
            if [[ -z $serving ]]; then
              echo "::notice::$SERIES serves nothing yet; its first version has nothing to go back past"
              exit 0
            fi
            core=${serving%% *}
            gh release download "$core" --repo "${{ github.repository }}" \
              --pattern lock.json --output "$RUNNER_TEMP/series-lock.json"
            previous=$(jq -r .version "$RUNNER_TEMP/series-lock.json")
            [[ -n $previous && $previous != null ]] || {
              echo "::notice::$core records no version; nothing to compare"
              exit 0
            }
            echo "::notice::$SERIES serves $core, version $previous"
            ( cd buildscripts && ./buildscripts-ci describe --profile "$PROFILE" \
                --previous-version "$previous" --output /dev/null )
            exit 0
          fi
          previous=$(python3 scripts/state.py --repository "$STATE_URL" \
            --profile "$PROFILE" read --field version)
          [[ -n $previous ]] || exit 0
          recorded=$(python3 scripts/state.py --repository "$STATE_URL" \
            --profile "$PROFILE" read --field build_id)
          [[ $recorded != "$BUILD_ID" ]] || exit 0
          ( cd buildscripts && ./buildscripts-ci describe --profile "$PROFILE" \
              --previous-version "$previous" --output /dev/null )

      # Latest wins: this input becomes the candidate now, before anything is
      # built, so a build that started earlier and finishes later can tell it
      # was overtaken. The generation it gets back is what says so.
      - name: Make this input the candidate
        id: candidate
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && steps.dedup.outputs.duplicate != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ steps.ref.outputs.profile }}
          STATE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          READ_URL: ${{ github.server_url }}/${{ github.repository }}
          BUILD_ID: ${{ steps.describe.outputs.build_id }}
          VERSION: ${{ steps.describe.outputs.version }}
        run: |
          acquire() {
            python3 scripts/state.py --repository "$STATE_URL" --profile "$PROFILE" \
              record --build-id "$BUILD_ID" --version "$VERSION" --run "$GITHUB_RUN_ID" "$@"
          }
          status=0
          generation=$(acquire) || status=$?
          # Refused: another run recorded this same input and has not published
          # it. Whether that means anything depends on whether it is still
          # running, which is the one thing the state branch cannot know.
          if (( status == 3 )); then
            holder=$(python3 scripts/state.py --repository "$READ_URL" \
              --profile "$PROFILE" read --field run)
            holder_status=$(gh api "repos/${{ github.repository }}/actions/runs/$holder" \
              --jq .status 2>/dev/null || echo gone)
            case $holder_status in
            completed | gone)
              echo "::notice::run $holder holds $BUILD_ID and is $holder_status; taking it over"
              generation=$(acquire --take-over)
              ;;
            *)
              echo "::notice::$BUILD_ID is already being built by run $holder; nothing to build"
              echo "held=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            esac
          elif (( status != 0 )); then
            exit "$status"
          fi
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          echo "::notice::candidate generation $generation for $BUILD_ID"

  build:
    needs: prepare
    # The deduplication key is the build input, never the run number: the
    # same revision and world announced twice builds once.
    if: needs.prepare.outputs.duplicate != 'true'
    # The queue this run does belong in, now that describe has named the
    # input: two runs of one build_id serialize, two different ones never
    # meet. Not a pull request, though -- its build_id is whatever
    # buildscripts master holds, so every pull request would join the queue
    # of the master builds of that revision, and a job held in an occupied
    # group is cancelled rather than delayed. One of them evicted the cron
    # backstop this afternoon, after that run had already recorded itself as
    # the candidate, which left the channel with a candidate no run was
    # producing. A pull request gets a group of its own; there is nothing for
    # it to serialize with, since the workflow-level group already keeps one
    # run alive per branch.
    concurrency:
      group: autobuilds-build-${{ github.event_name == 'pull_request' && github.run_id || needs.prepare.outputs.build_id }}
      cancel-in-progress: false
    uses: vitasdk/buildscripts/.github/workflows/build-sdk.yml@master
    with:
      lock: ${{ needs.prepare.outputs.lock }}

  publish-snapshot:
    needs: [prepare, build]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      snapshot_tag: ${{ steps.publish.outputs.snapshot_tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: vitasdk/buildscripts
          ref: ${{ needs.prepare.outputs.buildscripts_revision }}
          path: buildscripts

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.release_tree_artifact }}
          path: repository

      - name: Verify the grouped release tree
        shell: bash
        run: buildscripts/buildscripts-ci verify --tree repository

      - name: Enforce the required-host publication policy
        shell: bash
        run: |
          tree_build_id=$(jq -r .build_id repository/release.json)
          [[ $tree_build_id == '${{ needs.prepare.outputs.build_id }}' ]] || {
            echo "::error::release tree build_id $tree_build_id does not match the lock's ${{ needs.prepare.outputs.build_id }}"
            exit 1
          }
          published_hosts=$(jq -r '.hosts[].name' repository/release.json | LC_ALL=C sort -u)
          for host in $REQUIRED_HOSTS; do
            grep -qxF "$host" <<<"$published_hosts" || {
              echo "::error::required host $host is missing from the published release tree"
              exit 1
            }
          done

      - name: Publish immutable grouped snapshot
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          # The lock names every source revision that went in; without it a
          # snapshot records what it contains but not what produced it.
          LOCK_JSON: ${{ needs.prepare.outputs.lock }}
          PROFILE: ${{ needs.prepare.outputs.profile }}
        shell: bash
        run: |
          mkdir publish
          cp repository/* publish/
          printf '%s\n' "$LOCK_JSON" > publish/lock.json
          # A release tag is what everything downstream names a core by, so it
          # has to say which world the core is of: two of them differ in the
          # ABI of everything they compile, and telling them apart by opening
          # the notes is not telling them apart. The profile goes in as it is
          # written rather than shortened, because a world is enumerated by
          # hand everywhere else here and a shortening is a rule to get wrong.
          # The default world keeps the name it has always published under.
          tag_prefix=sdk-snapshot-
          if [[ $PROFILE != "$DEFAULT_PROFILE" ]]; then
            tag_prefix="sdk-$PROFILE-snapshot-"
          fi
          snapshot_tag="${tag_prefix}$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "snapshot_tag=$snapshot_tag" >> "$GITHUB_OUTPUT"
          # The build_id line is what the next run reads to know this input
          # is already published; keep it a line of its own.
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Package-managed SDK preview built from buildscripts revision ${{ needs.prepare.outputs.buildscripts_revision }}.

          build_id: ${{ needs.prepare.outputs.build_id }}
          profile: ${{ needs.prepare.outputs.profile }}
          version: ${{ needs.prepare.outputs.version }}
          NOTES
          gh release create "$snapshot_tag" --draft --prerelease \
            --target "$GITHUB_SHA" --title "$snapshot_tag" \
            --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$snapshot_tag" publish/*
          mkdir downloaded-release
          gh release download "$snapshot_tag" --dir downloaded-release
          diff -ru publish downloaded-release
          gh release edit "$snapshot_tag" --draft=false

      # A snapshot is immutable and always worth publishing, but only the
      # current candidate gets to be the one a channel moves to. A build that
      # was overtaken while it ran says so here and stops being anybody's
      # candidate, without that being a failure.
      - name: Name the snapshot this candidate became
        if: needs.prepare.outputs.generation != ''
        shell: bash
        env:
          PROFILE: ${{ needs.prepare.outputs.profile }}
          STATE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          status=0
          python3 scripts/state.py --repository "$STATE_URL" --profile "$PROFILE" \
            publish --generation '${{ needs.prepare.outputs.generation }}' \
            --core-snapshot '${{ steps.publish.outputs.snapshot_tag }}' || status=$?
          case $status in
          0) ;;
          3) echo "::notice::a newer candidate exists; ${{ steps.publish.outputs.snapshot_tag }} is published but will not move a channel" ;;
          *) exit "$status" ;;
          esac

      # The catalogue is built by vitasdk/vitasdk-autobuild, which pins the
      # core it builds against rather than being handed one per build. All it
      # needs is the tag: what to build, and which recipes, are its own.
      - name: Announce the published core to the package autobuilder
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::REPO_DISPATCH_TOKEN secret is required for cross-repo dispatch to vitasdk/vitasdk-autobuild"
            exit 1
          fi
          # The world as well as the series. A core belongs to one of each,
          # and the catalogue side matches on both: told only the series it
          # finds whichever world happens to be first in it, which is how a
          # softfp core came to be pinned as the default world's.
          gh api repos/vitasdk/vitasdk-autobuild/dispatches \
            -f event_type=core_published \
            -f client_payload[core_snapshot]="${{ steps.publish.outputs.snapshot_tag }}" \
            -f client_payload[series]="${{ needs.prepare.outputs.series }}" \
            -f client_payload[world]="${{ needs.prepare.outputs.profile }}"
