name: Build

on:
  push:
  repository_dispatch:
    types: [run_build]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake cmake-data git build-essential autoconf automake libtool texinfo bison flex pkg-config ccache
    - name: ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-
    - name: Clone
      run: |
        git clone https://github.com/vitasdk/buildscripts.git
    - name: downloads
      uses: actions/cache@v4
      with:
        path: buildscripts/build/downloads
        key: ${{ runner.os }}-downloads-${{ hashFiles('buildscripts/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-downloads-
    - name: Build
      run: |
        cd buildscripts
        git config --global user.email "builds@travis-ci.com"
        git config --global user.name "Travis CI"
        mkdir -p build
        cd build
        cmake ..
        make -j$(nproc) tarball
    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: vitasdk-linux
        path: buildscripts/build/*.tar.bz2
    - uses: svenstaro/upload-release-action@v2
      if: contains(github.ref,'refs/heads/master')
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: buildscripts/build/*.tar.bz2
        overwrite: true
        file_glob: true
        tag: master-linux-v2.${{github.run_number}}     
        release_name: master-linux-v2.${{github.run_number}}
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake cmake-data git build-essential autoconf automake libtool texinfo bison flex pkg-config ccache
    - name: ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-
    - name: Clone
      run: |
        git clone https://github.com/vitasdk/buildscripts.git
    - name: downloads
      uses: actions/cache@v4
      with:
        path: buildscripts/build/downloads
        key: ${{ runner.os }}-downloads-${{ hashFiles('buildscripts/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-downloads-
    - name: Build
      run: |
        cd buildscripts
        git config --global user.email "builds@travis-ci.com"
        git config --global user.name "Travis CI"
        mkdir -p build
        cd build
        cmake ..
        make -j$(nproc) tarball
    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: vitasdk-linux-arm64
        path: buildscripts/build/*.tar.bz2
    - uses: svenstaro/upload-release-action@v2
      if: contains(github.ref,'refs/heads/master')
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: buildscripts/build/*.tar.bz2
        overwrite: true
        file_glob: true
        tag: master-linux-arm64-v2.${{github.run_number}}     
        release_name: master-linux-arm64-v2.${{github.run_number}}
  build-macos:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
    - name: Install dependencies
      run: |
        brew install autoconf automake libtool texinfo ccache
    - name: ccache
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-
    - name: Clone
      run: |
        git clone https://github.com/vitasdk/buildscripts.git
    - name: downloads
      uses: actions/cache@v4
      with:
        path: buildscripts/build/downloads
        key: ${{ runner.os }}-downloads-${{ hashFiles('buildscripts/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-downloads-
    - name: Build
      run: |
        cd buildscripts
        git config --global user.email "builds@travis-ci.com"
        git config --global user.name "Travis CI"
        mkdir -p build
        cd build
        cmake ..
        make -j$(sysctl -n hw.logicalcpu) tarball
    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: vitasdk-macos
        path: buildscripts/build/*.tar.bz2
    - uses: svenstaro/upload-release-action@v2
      if: contains(github.ref,'refs/heads/master')
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: buildscripts/build/*.tar.bz2
        overwrite: true
        file_glob: true
        tag: master-osx-v2.${{github.run_number}}     
        release_name: master-osx-v2.${{github.run_number}}
  build-windows:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake cmake-data git build-essential autoconf automake libtool texinfo bison flex pkg-config g++-mingw-w64 ccache
    - name: ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-
    - name: Clone
      run: |
        git clone https://github.com/vitasdk/buildscripts.git
    - name: downloads
      uses: actions/cache@v4
      with:
        path: buildscripts/build/downloads
        key: ${{ runner.os }}-downloads-${{ hashFiles('buildscripts/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-downloads-
    - name: Build
      run: |
        cd buildscripts
        git config --global user.email "builds@travis-ci.com"
        git config --global user.name "Travis CI"
        unset CXX
        unset CC
        mkdir -p build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=toolchain-x86_64-w64-mingw32.cmake
        make -j$(nproc) tarball
    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: vitasdk-windows
        path: buildscripts/build/*.tar.bz2
    - uses: svenstaro/upload-release-action@v2
      if: contains(github.ref,'refs/heads/master')
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: buildscripts/build/*.tar.bz2
        overwrite: true
        file_glob: true
        tag: master-win-v2.${{github.run_number}}     
        release_name: master-win-v2.${{github.run_number}}
