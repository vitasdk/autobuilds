name: Update Channel Manifest

on:
  workflow_dispatch:
    inputs:
      core_release:
        description: Core SDK snapshot release tag (e.g. sdk-snapshot-20260811.1.1)
        required: true
        type: string
      packages_release:
        description: Packages snapshot release tag (e.g. packages-snapshot-20260811.1.1)
        required: true
        type: string
      channel:
        # A free string rather than a list: a release series is a channel, so
        # 2026.09 has to be publishable without editing this file. The
        # generator checks the name.
        description: Target channel name (nightly, stable, or a series such as 2026.09)
        required: false
        default: nightly
        type: string
      sequence:
        description: Monotonic sequence number (leave empty for auto)
        required: false
        type: string
      buildscripts_sha:
        description: Exact buildscripts commit the packages release must record
        required: false
        type: string
      packages_repository:
        description: Repository holding the packages release
        required: false
        default: vitasdk/vitasdk-autobuild
        type: string
  repository_dispatch:
    types: [update_channel]

permissions:
  contents: write

jobs:
  update-channel:
    runs-on: ubuntu-24.04
    env:
      # The catalogue lives in its own repository now. Whoever asks for a
      # manifest says where the packages are, and the manifest records it so
      # the client builds its URLs from that.
      PACKAGES_REPOSITORY: ${{ inputs.packages_repository || github.event.client_payload.packages_repository || 'vitasdk/vitasdk-autobuild' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out vitasdk.github.io
        uses: actions/checkout@v7
        with:
          repository: vitasdk/vitasdk.github.io
          path: vitasdk.github.io
          token: ${{ secrets.REPO_DISPATCH_TOKEN || github.token }}

      - name: Resolve parameters
        id: params
        shell: bash
        run: |
          if [[ -n '${{ inputs.core_release }}' ]]; then
            core='${{ inputs.core_release }}'
            pkgs='${{ inputs.packages_release }}'
            chan='${{ inputs.channel }}'
            seq='${{ inputs.sequence }}'
            b_sha='${{ inputs.buildscripts_sha }}'
          elif [[ -n '${{ github.event.client_payload.packages_snapshot }}' ]]; then
            pkgs='${{ github.event.client_payload.packages_snapshot }}'
            core='${{ github.event.client_payload.core_snapshot }}'
            chan='nightly'
            seq=""
            b_sha='${{ github.event.client_payload.buildscripts_sha }}'
          fi
          
          if [[ -z "$core" || -z "$pkgs" ]]; then
            echo "::error::Both core_release and packages_release must be explicitly provided (no latest-release fallback allowed)"
            exit 1
          fi
          
          if [[ -z "$seq" ]]; then
            # Generate monotonic sequence number based on timestamp and run number
            seq=$(date -u +%Y%m%d)${{ github.run_number }}
          fi
          
          echo "core_release=$core" >> "$GITHUB_OUTPUT"
          echo "packages_release=$pkgs" >> "$GITHUB_OUTPUT"
          echo "channel=$chan" >> "$GITHUB_OUTPUT"
          echo "sequence=$seq" >> "$GITHUB_OUTPUT"
          echo "buildscripts_sha=$b_sha" >> "$GITHUB_OUTPUT"

      - name: Verify package provenance against core release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          core='${{ steps.params.outputs.core_release }}'
          pkgs='${{ steps.params.outputs.packages_release }}'
          expected_b_sha='${{ steps.params.outputs.buildscripts_sha }}'
          
          echo "Downloading provenance.json from $PACKAGES_REPOSITORY release $pkgs..."
          # mktemp creates the file, and the download refuses to write over one
          # that exists, so without --clobber this step can only ever fail.
          provenance_tmp=$(mktemp)
          if ! gh release download "$pkgs" --repo "$PACKAGES_REPOSITORY" --pattern "provenance.json" --output "$provenance_tmp" --clobber; then
            echo "::error::Could not download provenance.json from packages release $pkgs"
            exit 1
          fi
          
          actual_core=$(python3 -c "import json; print(json.load(open('$provenance_tmp')).get('core_snapshot', ''))")
          if [[ "$actual_core" != "$core" ]]; then
            echo "::error::Provenance mismatch! Packages release '$pkgs' was built against '$actual_core', but channel requested '$core'"
            exit 1
          fi
          
          if [[ -n "$expected_b_sha" ]]; then
            actual_b_sha=$(python3 -c "import json; print(json.load(open('$provenance_tmp')).get('buildscripts_revision', ''))")
            if [[ -n "$actual_b_sha" && "$actual_b_sha" != "$expected_b_sha" ]]; then
              echo "::error::Provenance buildscripts mismatch! Packages has '$actual_b_sha', expected '$expected_b_sha'"
              exit 1
            fi
          fi
          
          echo "Provenance verified: packages '$pkgs' was built against exact core '$core'"
          rm -f "$provenance_tmp"

          # Carried into the manifest so the client can say something at the
          # moment somebody installs one of these. A snapshot from before this
          # existed simply has no such file.
          if gh release download "$pkgs" --repo "$PACKAGES_REPOSITORY" \
               --pattern "deprecated.json" --output "$RUNNER_TEMP/deprecated.json"; then
            echo "deprecated=$RUNNER_TEMP/deprecated.json" >> "$GITHUB_ENV"
          else
            echo "::notice::this snapshot publishes no deprecation list"
          fi

      - name: Generate and sign manifest
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.CHANNEL_SIGNING_KEY }}
        run: |
          mkdir -p vitasdk.github.io/channels
          key_file=$(mktemp)
          echo "$SIGNING_KEY" > "$key_file"
          
          python3 scripts/generate-channel-manifest.py \
            --core-release '${{ steps.params.outputs.core_release }}' \
            --packages-release '${{ steps.params.outputs.packages_release }}' \
            --channel '${{ steps.params.outputs.channel }}' \
            --sequence '${{ steps.params.outputs.sequence }}' \
            --packages-repository "$PACKAGES_REPOSITORY" \
            ${deprecated:+--deprecated "$deprecated"} \
            --key "$key_file" \
            --output-dir vitasdk.github.io/channels
          
          rm -f "$key_file"

      # Republished with every manifest so a series that changed state says so
      # without anybody remembering to run a second thing.
      - name: Generate and sign the release index
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.CHANNEL_SIGNING_KEY }}
        run: |
          key_file=$(mktemp)
          echo "$SIGNING_KEY" > "$key_file"
          python3 scripts/generate-channel-index.py \
            --source channels.json \
            --key "$key_file" \
            --output-dir vitasdk.github.io/channels
          rm -f "$key_file"

      - name: Commit and push manifest to Pages
        shell: bash
        run: |
          cd vitasdk.github.io
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels/
          git commit -m "channel: update ${{ steps.params.outputs.channel }} to core ${{ steps.params.outputs.core_release }} and packages ${{ steps.params.outputs.packages_release }}" || exit 0
          git push origin master

      # Pages deploys after the push, not with it. Announcing the channel
      # before it is actually being served would have the image builder fetch
      # the previous manifest, conclude that nothing changed and build nothing
      # -- and the failure would look exactly like a quiet day.
      - name: Wait for the channel to be served
        shell: bash
        run: |
          set -euo pipefail
          channel='${{ steps.params.outputs.channel }}'
          expected=$(sha256sum "vitasdk.github.io/channels/$channel.json" | cut -d' ' -f1)
          url="https://vitasdk.org/channels/$channel.json"
          for attempt in $(seq 1 60); do
            served=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1) || served=
            if [[ $served == "$expected" ]]; then
              echo "$channel is being served after ${attempt} attempts"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$url still does not serve the manifest published by this run"
          exit 1

      # The images are rebuilt by vitasdk/docker, which resolves everything it
      # needs from the published channel. All it is handed is the name of the
      # series that moved: whether that warrants a new image is its own
      # decision, taken by comparing what it published last time.
      - name: Announce the published channel to the image builder
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::REPO_DISPATCH_TOKEN secret is required for cross-repo dispatch to vitasdk/docker"
            exit 1
          fi
          gh api repos/vitasdk/docker/dispatches \
            -f event_type=channel_published \
            -f client_payload[channel]="${{ steps.params.outputs.channel }}"
