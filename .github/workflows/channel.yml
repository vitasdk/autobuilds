name: Update Channel Manifest

on:
  workflow_dispatch:
    inputs:
      core_release:
        description: Core SDK snapshot release tag (e.g. sdk-snapshot-20260811.1.1)
        required: true
        type: string
      packages_release:
        description: Packages snapshot release tag (e.g. packages-snapshot-20260811.1.1)
        required: true
        type: string
      channel:
        # A free string rather than a list: a release series is a channel, so
        # 2026.09 has to be publishable without editing this file. The
        # generator checks the name.
        description: Target channel name (nightly, stable, or a series such as 2026.09)
        required: false
        default: nightly
        type: string
      world:
        # Not a list, for the same reason the channel is not: adding a world
        # is a commit in the repository that builds them, and this file must
        # not have to be edited to publish one. The manifest generator checks
        # the name against the worlds it knows.
        description: Toolchain world the snapshot was built for
        required: false
        default: vita
        type: string
      sequence:
        description: Monotonic sequence number (leave empty for auto)
        required: false
        type: string
      buildscripts_sha:
        description: Exact buildscripts commit the packages release must record
        required: false
        type: string
      packages_repository:
        description: Repository holding the packages release
        required: false
        default: vitasdk/vitasdk-autobuild
        type: string
  repository_dispatch:
    types: [update_channel]
  # A promotion is the commit that edits channels.json, so publishing it is
  # what happens when that commit lands. The pull request checked the pair
  # before the merge; this checks it again, because it is cheap and because
  # a snapshot is immutable but a file is not.
  push:
    branches: [master]
    paths:
      - channels.json

permissions:
  contents: write

jobs:
  promotions:
    runs-on: ubuntu-24.04
    outputs:
      entries: ${{ steps.resolve.outputs.entries }}
      sequence: ${{ steps.resolve.outputs.sequence }}
      buildscripts_sha: ${{ steps.resolve.outputs.buildscripts_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The promotion is the difference between two commits of one file.
          fetch-depth: 0

      - id: resolve
        shell: bash
        env:
          CORE: ${{ inputs.core_release || github.event.client_payload.core_snapshot }}
          PACKAGES: ${{ inputs.packages_release || github.event.client_payload.packages_snapshot }}
          CHANNEL: ${{ inputs.channel || github.event.client_payload.channel }}
          WORLD: ${{ inputs.world || github.event.client_payload.world }}
          SEQUENCE: ${{ inputs.sequence }}
          BUILDSCRIPTS_SHA: ${{ inputs.buildscripts_sha || github.event.client_payload.buildscripts_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ '${{ github.event_name }}' == push ]]; then
            git show "$BEFORE:channels.json" > "$RUNNER_TEMP/before.json" 2>/dev/null ||
              : > "$RUNNER_TEMP/before.json"
            # A series that moves by commit is never automatic: its pair is
            # written down, which is what promotions reports on.
            entries=$(python3 scripts/promotions.py \
              --before "$RUNNER_TEMP/before.json" --after channels.json |
              jq -c 'map(. + {automatic: false})')
          else
            # A dispatch says everything itself: nightly's pair is not in the
            # file, and neither is a promotion somebody is replaying by hand.
            if [[ -z $CORE || -z $PACKAGES || -z $CHANNEL ]]; then
              echo "::error::core_release, packages_release and channel must all be explicitly provided (no default fallback allowed)"
              exit 1
            fi
            # The world is what decides which database the manifest names and
            # which core it installs, so it is carried rather than defaulted:
            # a dispatch that forgot it would publish a channel serving one
            # world's packages against another world's toolchain.
            if [[ -z $WORLD ]]; then
              echo "::error::world must be provided; it decides the database and the core"
              exit 1
            fi
            # Whether this one moves on its own is not guessed from its
            # name: the file that decides it is asked.
            automatic=$(python3 scripts/promotions.py --after channels.json \
              --automatic "$CHANNEL")
            entries=$(jq -nc --arg name "$CHANNEL" --arg core "$CORE" \
              --arg packages "$PACKAGES" --arg world "$WORLD" \
              --argjson automatic "$automatic" \
              '[{name: $name, core: $core, packages: $packages, world: $world,
                 automatic: $automatic}]')
          fi
          echo "entries=$entries" >> "$GITHUB_OUTPUT"
          echo "buildscripts_sha=$BUILDSCRIPTS_SHA" >> "$GITHUB_OUTPUT"
          if [[ $entries == "[]" ]]; then
            echo "::notice::this commit repoints no series"
          else
            echo "::notice::publishing $entries"
          fi
          # Monotonic per channel, and one number for everything this run
          # publishes: the client compares sequences within a channel.
          echo "sequence=${SEQUENCE:-$(date -u +%Y%m%d)${{ github.run_number }}}" >> "$GITHUB_OUTPUT"

  update-channel:
    needs: promotions
    if: needs.promotions.outputs.entries != '[]'
    runs-on: ubuntu-24.04
    strategy:
      # One bad pair must not take the other series down with it.
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.promotions.outputs.entries) }}
    concurrency:
      group: channel-${{ matrix.entry.name }}
      cancel-in-progress: false
    env:
      # The catalogue lives in its own repository now. Whoever asks for a
      # manifest says where the packages are, and the manifest records it so
      # the client builds its URLs from that.
      PACKAGES_REPOSITORY: ${{ inputs.packages_repository || github.event.client_payload.packages_repository || 'vitasdk/vitasdk-autobuild' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out vitasdk.github.io
        uses: actions/checkout@v7
        with:
          repository: vitasdk/vitasdk.github.io
          path: vitasdk.github.io
          token: ${{ secrets.REPO_DISPATCH_TOKEN || github.token }}

      - name: Verify the pair belongs to the channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify-release-pair.py \
            --core-release '${{ matrix.entry.core }}' \
            --packages-release '${{ matrix.entry.packages }}' \
            --packages-repository "$PACKAGES_REPOSITORY" \
            --channel '${{ matrix.entry.name }}' \
            --world '${{ matrix.entry.world }}' \
            --buildscripts-sha '${{ needs.promotions.outputs.buildscripts_sha }}'

      # A channel that moves on its own moves to the newest candidate and to
      # nothing else. Packages for a core that was overtaken while they built
      # still arrive, and they must not walk the channel backwards; a series
      # has no candidate, it has a commit, so this is a question only the
      # automatic channels have -- every one of them, not just the first.
      - name: Is this still the candidate
        id: candidate
        if: matrix.entry.automatic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CORE: ${{ matrix.entry.core }}
          STATE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          profile=$(gh release download "$CORE" --repo '${{ github.repository }}' \
            --pattern lock.json --output - | jq -r '.profile')
          status=0
          python3 scripts/state.py --repository "$STATE_URL" --profile "$profile" \
            promote --core-snapshot "$CORE" || status=$?
          case $status in
          0) ;;
          3)
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$CORE is no longer the candidate for $profile; nightly stays where it is"
            ;;
          *) exit "$status" ;;
          esac

      # Carried into the manifest so the client can say something at the
      # moment somebody installs one of these. A snapshot from before this
      # existed simply has no such file.
      - name: Take the snapshot's deprecation list, if it has one
        if: steps.candidate.outputs.stale != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download '${{ matrix.entry.packages }}' \
               --repo "$PACKAGES_REPOSITORY" \
               --pattern "deprecated.json" --output "$RUNNER_TEMP/deprecated.json"; then
            echo "deprecated=$RUNNER_TEMP/deprecated.json" >> "$GITHUB_ENV"
          else
            echo "::notice::this snapshot publishes no deprecation list"
          fi

      - name: Generate and sign manifest
        if: steps.candidate.outputs.stale != 'true'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.CHANNEL_SIGNING_KEY }}
          # The generator asks the API which host databases a core release
          # carries. Anonymous quota on a runner is shared and routinely
          # spent, and two worlds publishing together ask twice as often, so
          # the second one is the one that finds it gone.
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p vitasdk.github.io/channels
          key_file=$(mktemp)
          echo "$SIGNING_KEY" > "$key_file"
          
          python3 scripts/generate-channel-manifest.py \
            --core-release '${{ matrix.entry.core }}' \
            --packages-release '${{ matrix.entry.packages }}' \
            --channel '${{ matrix.entry.name }}' \
            --world '${{ matrix.entry.world }}' \
            --sequence '${{ needs.promotions.outputs.sequence }}' \
            --packages-repository "$PACKAGES_REPOSITORY" \
            ${deprecated:+--deprecated "$deprecated"} \
            --key "$key_file" \
            --output-dir vitasdk.github.io/channels
          
          rm -f "$key_file"

      # Republished with every manifest so a series that changed state says so
      # without anybody remembering to run a second thing.
      - name: Generate and sign the release index
        if: steps.candidate.outputs.stale != 'true'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.CHANNEL_SIGNING_KEY }}
        run: |
          key_file=$(mktemp)
          echo "$SIGNING_KEY" > "$key_file"
          python3 scripts/generate-channel-index.py \
            --source channels.json \
            --key "$key_file" \
            --output-dir vitasdk.github.io/channels
          rm -f "$key_file"

      - name: Commit and push manifest to Pages
        if: steps.candidate.outputs.stale != 'true'
        shell: bash
        run: |
          cd vitasdk.github.io
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels/
          git commit -m "channel: update ${{ matrix.entry.name }} to core ${{ matrix.entry.core }} and packages ${{ matrix.entry.packages }}" || exit 0
          git push origin master

      # Pages deploys after the push, not with it. Announcing the channel
      # before it is actually being served would have the image builder fetch
      # the previous manifest, conclude that nothing changed and build nothing
      # -- and the failure would look exactly like a quiet day.
      - name: Wait for the channel to be served
        if: steps.candidate.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          channel='${{ matrix.entry.name }}'
          expected=$(sha256sum "vitasdk.github.io/channels/$channel.json" | cut -d' ' -f1)
          url="https://vitasdk.org/channels/$channel.json"
          for attempt in $(seq 1 60); do
            served=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1) || served=
            if [[ $served == "$expected" ]]; then
              echo "$channel is being served after ${attempt} attempts"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$url still does not serve the manifest published by this run"
          exit 1

      # The images are rebuilt by vitasdk/docker, which resolves everything it
      # needs from the published channel. All it is handed is the name of the
      # series that moved: whether that warrants a new image is its own
      # decision, taken by comparing what it published last time.
      - name: Announce the published channel to the image builder
        if: steps.candidate.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::REPO_DISPATCH_TOKEN secret is required for cross-repo dispatch to vitasdk/docker"
            exit 1
          fi
          gh api repos/vitasdk/docker/dispatches \
            -f event_type=channel_published \
            -f client_payload[channel]="${{ matrix.entry.name }}"
